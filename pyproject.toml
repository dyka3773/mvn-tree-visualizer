[project]
name = "mvn-tree-visualizer"
version = "1.9.0"
authors = [
    { name = "Iraklis Konsoulas", email = "dyka3773@gmail.com" },
]
description = "A simple command line tool to visualize the dependency tree of a Maven project in a graphical format."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "maven",
    "dependency",
    "visualization",
    "tree",
    "cli",
    "command-line",
    "tool",
    "graph",
    "mermaid",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "jinja2==3.1.6",
    "watchdog==6.0.0",
]

[project.urls]
source = "https://github.com/dyka3773/mvn-tree-visualizer"

[project.scripts]
mvn-tree-visualizer = "mvn_tree_visualizer.cli:cli"

[dependency-groups]
dev = [
    "twine==6.2.0",
    "python-semantic-release==10.5.3",
    "build==1.5.0",
    "git-changelog==2.9.4",
    "tox==4.55.1",
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
]

[build-system]
build-backend  = 'hatchling.build'
requires = ['hatchling']

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    python -m pip install uv
    uv lock --upgrade-package backend
    git add uv.lock
    uv build
"""
dist_path = "dist/"
upload_to_pypi = true
upload_to_release = true
remove_dist = false
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
tag_format = "v{version}"

[tool.semantic_release.branches.master]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "deps"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test", "deps"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- insertion marker -->"
template_dir = "templates" # That means we should avoid creating such a folder unless we have custom changelog templates

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.tox]
env_list = ["lint", "3.10", "3.11", "3.12", "3.13"]

[tool.tox.env_run_base]
description = "Run tests with the current Python version"
deps = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
]
commands = [
    ["pytest", "--cov=mvn_tree_visualizer", "--cov-report=term-missing", "--cov-report=html", "--cov-report=xml", "-v"]
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.tox.env.lint]
description = "Lint the codebase with ruff"
deps = [
    "ruff==0.12.3",
]
skip_install = true
commands = [[ "ruff", "check", "src/", "tests/" ]]